services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poolarena
      POSTGRES_PASSWORD: poolarena_dev
      POSTGRES_DB: poolarena
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poolarena -d poolarena"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BROWSER=none
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - DATABASE_URL=postgres://poolarena:poolarena_dev@db:5432/poolarena
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-admin}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "npm install && node src/db/migrate.js && exec npm run dev"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 50s
      retries: 5

volumes:
  pgdata:
